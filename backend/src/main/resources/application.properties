server.port=${PORT:8080}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.fallback.model=${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
gemini.ocr.model=gemini-2.5-flash
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding.dimension=${GEMINI_EMBEDDING_DIMENSION:512}
# AI backend for ALL features (chat, embeddings, transcription, OCR, live voice):
# "openai" or "gemini" (default). Switch to openai to dodge Gemini quota exhaustion.
ai.provider=${AI_PROVIDER:gemini}
ai.chat.max-output-tokens=${AI_CHAT_MAX_OUTPUT_TOKENS:2400}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.ocr.model=${OPENAI_OCR_MODEL:gpt-4o}
openai.transcribe.model=${OPENAI_TRANSCRIBE_MODEL:whisper-1}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding.dimension=${OPENAI_EMBEDDING_DIMENSION:512}
openai.realtime.model=${OPENAI_REALTIME_MODEL:gpt-realtime}
openai.realtime.voice=${OPENAI_REALTIME_VOICE:alloy}
pinecone.api.key=${PINECONE_API_KEY:}
pinecone.index.url=${PINECONE_INDEX_URL:}
# Discard weak semantic matches so unrelated chunks cannot become legal evidence.
rag.min-score=${RAG_MIN_SCORE:0.45}
# Live legal evidence source. Only active normative documents are queried.
lexuz.enabled=${LEXUZ_ENABLED:true}
lexuz.base-url=${LEXUZ_BASE_URL:https://lex.uz}
lexuz.max-documents=${LEXUZ_MAX_DOCUMENTS:6}
lexuz.max-snippets-per-document=${LEXUZ_MAX_SNIPPETS_PER_DOCUMENT:6}
lexuz.cache-ttl-seconds=${LEXUZ_CACHE_TTL_SECONDS:3600}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=-1
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
